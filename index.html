<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحديد موقع الهاتف</title>
</head>
<body>
<h2>تحديد موقع الهاتف</h2>
<button onclick="getLocation()">تحديد موقعي</button>
<p id="result">اضغط على الزر لتحديد موقعك.</p>

<script>
function getLocation() {
    const result = document.getElementById("result");

    if (!navigator.geolocation) {
        result.textContent = "المتصفح لا يدعم تحديد الموقع.";
        return;
    }

    result.textContent = "جارٍ تحديد الموقع...";

    navigator.geolocation.getCurrentPosition(
        function(position) {
            result.textContent =
                "خط العرض: " + position.coords.latitude +
                " | خط الطول: " + position.coords.longitude;
        },
        function(error) {
            result.textContent =
                "تعذّر تحديد الموقع. تأكد من السماح للمتصفح باستخدام الموقع.";
        },
        {
            enableHighAccuracy: true,
            timeout: 15000
        }
    );
}
</script>
</body>
</html>
